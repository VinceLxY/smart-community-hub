<title>Smart Community Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar with role switch; app column plus demo-story/live-log panel on desktop; bottom tab bar on phones. */
:root{
  --bg:#EDF2EE; --surface:#FFFFFF; --surface2:#E3EBE6; --ink:#12211C; --muted:#586A62; --line:#D2DCD6;
  --brand:#0E6B57; --on-brand:#FFFFFF; --brand-soft:#D5EDE4;
  --ok:#1B7F47; --ok-soft:#D8F0E1; --warn:#8F5A00; --warn-soft:#FBEBCB; --bad:#B8362F; --bad-soft:#F9DAD7; --info:#1F5FA8; --info-soft:#DCE8F7; --mute:#586A62; --mute-soft:#E3EBE6;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'Figtree',system-ui,-apple-system,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1613; --surface:#15221D; --surface2:#1C2D27; --ink:#E7F0EC; --muted:#93A89F; --line:#28403A;
  --brand:#3FBF9F; --on-brand:#06201A; --brand-soft:#17382F;
  --ok:#4CC27F; --ok-soft:#163626; --warn:#E3B24C; --warn-soft:#3A2D10; --bad:#F2766D; --bad-soft:#40201E; --info:#78AEEB; --info-soft:#18304D; --mute:#93A89F; --mute-soft:#1C2D27;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1613; --surface:#15221D; --surface2:#1C2D27; --ink:#E7F0EC; --muted:#93A89F; --line:#28403A;
  --brand:#3FBF9F; --on-brand:#06201A; --brand-soft:#17382F;
  --ok:#4CC27F; --ok-soft:#163626; --warn:#E3B24C; --warn-soft:#3A2D10; --bad:#F2766D; --bad-soft:#40201E; --info:#78AEEB; --info-soft:#18304D; --mute:#93A89F; --mute-soft:#1C2D27;
  color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.15} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
code,.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:.04em}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-size:18px;display:block;line-height:1.1}
.brand span{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface2);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.who{color:var(--muted);font-size:12.5px}

/* grid */
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding-block:18px}
@media (min-width:1000px){ .main{grid-template-columns:minmax(0,1fr) 340px;align-items:start} #side{position:sticky;top:132px} #side-btn{display:none} }
#side{display:none}
@media (min-width:1000px){ #side{display:block} }
#side.open{display:block;position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
#side .side-close{display:none}
#side.open .side-close{display:inline-flex}
@media (min-width:1000px){ #side.open{position:sticky;inset:auto;padding:0;overflow:visible;top:132px} #side.open .side-close{display:none} }

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#nav:empty{display:none}
#nav button{flex:1;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;position:relative}
#nav button[aria-current="page"]{color:var(--brand)}
#nav svg{width:22px;height:22px}
.dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
@media (min-width:700px){
  body{padding-bottom:40px}
  #nav{position:static;border:1px solid var(--line);border-radius:14px;padding:5px;gap:2px;margin-top:16px}
  #nav button{flex-direction:row;justify-content:center;gap:8px;font-size:13.5px;padding:9px 6px}
  #nav svg{width:18px;height:18px}
  .dot{position:static;margin-left:2px}
  .main{padding-top:0}
  .navhost{display:block}
}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.view{display:flex;flex-direction:column;gap:16px;max-width:680px;width:100%}
.view.wide{max-width:none}

/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h small,.muted{color:var(--muted)}
small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:6px}
.btn{border:1px solid transparent;background:var(--brand);color:var(--on-brand);padding:10px 16px;border-radius:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px}
.btn:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13.5px;border-radius:9px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-info{background:var(--info-soft);color:var(--info)} .t-mute{background:var(--mute-soft);color:var(--mute)}
label{font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:5px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:42px}
textarea{resize:vertical;min-height:76px}
.form{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:112px}
.tile:hover{border-color:var(--brand)}
.tile svg{width:26px;height:26px;color:var(--brand)}
.tile b{font-family:var(--f-display);font-size:16px}
.tile span{color:var(--muted);font-size:13px}
.alert-card{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px}
.alert-card div{display:flex;flex-direction:column;gap:2px;min-width:0}
.alert-card span{font-size:13.5px}
.lockers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lk{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:default;min-height:84px}
.lk b{font-family:var(--f-display);font-size:18px}
.lk small{color:var(--muted)}
.lk.free{cursor:pointer;border-color:var(--ok)}
.lk.sel{background:var(--brand-soft);border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.lk.busy{opacity:.7}
.steps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.steps i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.steps i::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--line)}
.steps i.on{color:var(--ink);font-weight:600}
.steps i.on::before{background:var(--brand);border-color:var(--brand)}
.qr{background:#fff;padding:10px;border-radius:12px;width:max-content;max-width:100%;border:1px solid var(--line);line-height:0}
.qr img,.qr canvas{max-width:100%;height:auto}
.qrbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qrbox code{background:var(--bg);padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px}
.bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:5px}
.bar.hot i{background:var(--warn)}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.attn b{color:var(--warn)}
.slots{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:480px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.slot b{font-variant-numeric:tabular-nums}
.slot small{color:var(--muted)}
.slot[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.slot:disabled{opacity:.45;cursor:not-allowed}
.verdict{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.verdict h3{font-size:20px}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.list li:last-child{border:0;padding:0}
.n-item{display:flex;gap:10px;align-items:flex-start}
.n-item .u{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:6px;flex:none}
.n-item .u.r{background:transparent;border:2px solid var(--line)}
.n-item p{font-size:13.5px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
/* side */
.story{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.story li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-brand)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk svg{width:13px;height:13px}
.story b{font-size:14px}
.story p{font-size:12.5px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;max-height:300px;overflow:auto}
.log li{font-size:12.5px;display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
.log em{font-style:normal;font-weight:700}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (min-width:700px){#toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></div>

</div>

  const cat=(CATS.find(c=>c[1].test(text))||['General'])[0];

const STOP=new Set(['the','and','are','not','for','with','has','have','this','that','there','near','from','been','very','our']);
const toks=(s)=>new Set(s.toLowerCase().replace(/[^a-z0-9一-龥 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.replace(/s$/,'')));
function findDup(text,loc){
  const a=toks(text),c=classify(text).cat;let best=null,bs=0;
  S.issues.filter(i=>i.status!=='Resolved').forEach(i=>{
    const b=toks(i.title+' '+(i.text||''));const inter=[...a].filter(x=>b.has(x)).length,uni=new Set([...a,...b]).size||1;
    const sc=inter/uni+(i.cat===c?.2:0)+(i.loc===loc?.2:0);
    if(i.cat===c&&sc>=.45&&sc>bs){bs=sc;best=i}

}

    if(i.supporters.includes(ME))notify('resident','Management responded',`“${i.title}”: ${t}`,'ok');
    logEv('manager',`responded to “${i.title}”.`);delete FORM['resp-'+id];commit();toast('Response posted')},
  resolve(id){const i=S.issues.find(x=>x.id===id);i.status='Resolved';i.hist.push(['Resolved',NOW()]);if(i.supporters.includes(ME))notify('resident','Issue resolved',i.title,'ok');logEv('manager',`marked “${i.title}” resolved.`);commit()},
  day(id){S.ui.ld=+id;S.ui.ls=null;commit()},
  slot(id){S.ui.ls=+id;commit()},
  'book-lift'(){const dk=dayKey(S.ui.ld),s=S.ui.ls,free=liftFree(dk,s);if(!free.length){toast('That slot was just taken');return}
    const b={id:nid('L'),unit:ME,date:dk,slot:s,lift:free[0],purpose:val('lf-purpose'),status:'Booked',token:'LF-'+Math.random().toString(36).slice(2,8).toUpperCase()};
    S.lifts.push(b);S.ui.ls=null;logEv('resident',`booked service lift ${b.lift}, ${dayName(dk)} ${slotLabel(s)}.`);notify('guard',`Lift ${b.lift} booked`,`Unit ${ME}, ${dayName(dk)} ${slotLabel(s)}.`);commit();toast('Lift booked. Show the QR at the lift.')},
  'lift-cancel'(id){const b=S.lifts.find(x=>x.id===id);b.status='Cancelled';logEv('resident',`cancelled lift booking ${slotLabel(b.slot)}.`);commit()},
  'lift-noshow'(id){const b=S.lifts.find(x=>x.id===id);b.status='Released';notify('resident','Lift slot released',`Not used within 15 minutes, so ${slotLabel(b.slot)} was released.`,'warn');logEv('system',`lift slot ${slotLabel(b.slot)} released after no-show.`);commit()},
  'lift-scan'(id){const b=S.lifts.find(x=>x.id===id);b.status='InUse';notify('resident','Lift booking confirmed',`Scanned at lift ${b.lift}.`,'ok');logEv('guard',`scanned lift ${b.lift} booking for Unit ${b.unit}.`);commit();toast('Booking verified. Lift in use.')},
  'lift-done'(id){const b=S.lifts.find(x=>x.id===id);b.status='Completed';logEv('guard',`lift ${b.lift} booking completed.`);commit()},
  'read-all'(){S.notifs.filter(n=>n.to===S.ui.role).forEach(n=>n.read=true);commit()}
};
let confirmReset=0;
function newIssue(text,loc){
  const first=text.split(/[.\n]/)[0].trim(),title=(first[0].toUpperCase()+first.slice(1)).slice(0,90);
  const i={id:nid('I'),title,text,loc,cat:'…',sev:'…',status:'Submitted',supporters:[ME],t:NOW(),hist:[['Submitted',NOW()]]};
  S.issues.push(i);delete FORM['is-text'];logEv('resident',`submitted “${title}”.`);commit();toast('Report submitted. Analysing…');
  setTimeout(()=>finish(i),900);
}
function finish(i){if(i.status!=='Submitted')return;const c=classify(i.title+' '+(i.text||''));i.cat=c.cat;i.sev=c.sev;i.status='Categorised';i.hist.push(['Categorised',NOW()]);
  logEv('system',`auto-categorised “${i.title}” as ${c.cat} (${c.sev}).`);commit();toast(`Categorised as ${c.cat}`)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b.dataset.id,b)});
document.addEventListener('input',e=>{if(e.target.id)FORM[e.target.id]=e.target.value;if(e.target.id==='vp-name'&&!S.ui.vpStart)S.ui.vpStart=NOW()});

/* ---------- clock: time-based transitions ---------- */
function tick(){
  const now=NOW();let ch=false;
  S.passes.forEach(p=>{const s=passState(p,now);if(p.lastSt!==s){const prev=p.lastSt;p.lastSt=s;ch=true;
    if(s==='Expired'&&prev!=='Expired'){notify('resident','Visitor pass expired',`${p.name}’s pass ended unused.`,'info');logEv('system',`pass for ${p.name} expired.`)}
    if(s==='Overstay'){notify('resident',`${p.name} is past the pass time`,'Security will verify with you.','warn');notify('guard','Overstay: verify visitor',`${p.name} (${p.token}) is still inside after ${fmtT(p.to)}.`,'warn');logEv('system',`${p.name} overstayed. Flagged for verification.`)}}});
  S.parcels.forEach(p=>{
    if(p.status==='Reserved'&&now-p.t>12*HOUR){p.status='Released';ch=true;if(p.unit===ME)notify('resident',`Locker ${p.locker} reservation released`,'No courier deposit within 12 hours.','warn');logEv('system',`locker ${p.locker} reservation released (no deposit in 12h).`)}
    if(p.status==='Occupied'&&!p.r24&&now-p.tDep>24*HOUR){p.r24=true;ch=true;if(p.unit===ME)notify('resident',`Parcel waiting in locker ${p.locker}`,`Please collect it. Pickup code ${p.code}.`,'warn');logEv('system',`reminder sent for parcel in locker ${p.locker} (24h).`)}
    if(p.status==='Occupied'&&!p.r72&&now-p.tDep>72*HOUR){p.r72=true;ch=true;notify('manager',`Uncollected parcel, locker ${p.locker}`,`Unit ${p.unit}, waiting over 72 hours.`,'warn');logEv('system',`locker ${p.locker} parcel uncollected for 72h. Manager alerted.`)}});
  S.lifts.forEach(b=>{if(b.status==='Booked'&&now>slotStart(b.date,b.slot)+15*MIN){b.status='Released';ch=true;if(b.unit===ME)notify('resident','Lift slot released',`${slotLabel(b.slot)} was not used within 15 minutes.`,'warn');logEv('system',`lift slot ${slotLabel(b.slot)} released (no-show).`)}});
  S.issues.forEach(i=>{if(i.status==='ThresholdReached'&&now>i.deadline&&!i.overdue){i.overdue=true;ch=true;notify('manager','Response overdue',`“${i.title}” passed its 48h deadline.`,'warn')}});
  if(ch){save();render()}else updCd();
}

S=load();
S.issues.forEach(i=>{if(i.status==='Submitted')finish(i)});
render();
setInterval(tick,1000);
</script>
